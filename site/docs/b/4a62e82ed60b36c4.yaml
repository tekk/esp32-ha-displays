version: 1
board: jc8048f550
chip: esp32s31

devices:
  audio_dac:
    type: audio_codec
    peripherals:
    - gpio_pa_control
    - i2s_audio_out
    - i2c_master

  audio_adc:
    type: audio_codec
    peripherals:
    - i2s_audio_in
    - i2c_master

  fs_sdcard:
    type: fs_fat
    sub_type: sdmmc
    io:
      clk: 24
      cmd: 25
      d0: 20
      d1: 21
      d2: 22
      d3: 23

  lcd_brightness:
    type: ledc_ctrl
    peripherals:
    - ledc_backlight

  display_lcd:
    type: display_lcd
    sub_type: rgb
    io:
      hsync_gpio_num: 44
      vsync_gpio_num: 45
      de_gpio_num: 43
      pclk_gpio_num: 40
      data_gpio_nums: [36, 37, 38, 39, 46, 7, 35, 51, 50, 49, 48, 4, 5, 0, 1, 6]

  lcd_touch:
    type: lcd_touch
    sub_type: i2c
    peripherals:
    - i2c_master
    dependencies:
      espressif/esp_lcd_touch_gt911: '*'

peripherals:
  i2c_master:
    type: i2c
    role: master
    io:
      sda_io_num: 2
      scl_io_num: 3

  i2s_audio_out:
    type: i2s
    role: master
    format: tdm-out
    io:
      bclk: 54
      ws: 47
      dout: 56
      din: 16

  i2s_audio_in:
    type: i2s
    role: master
    format: tdm-in
    io:
      bclk: 54
      ws: 47
      dout: 56
      din: 16

  gpio_pa_control:
    type: gpio
    role: io
    io:
      pin: 42

  ledc_backlight:
    type: ledc
    io:
      gpio_num: 17
